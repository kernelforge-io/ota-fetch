[network]
server_url = https://localhost:8443
tls_ca_cert = trust/tls-ca-chain.pem
tls_client_cert = client/client.crt
tls_client_key = client/client.key
connect_timeout = 5
retry_attempts = 1

[system]
update_interval_sec = 1
inbox_manifest_dir = var/lib/ota-fetch/inbox
current_manifest_dir = var/lib/ota-fetch/current
manifest_ca_cert = trust/manifest-ca-chain.pem
log_file = var/log/ota-fetch.log
;device_id = h4-gw
